[project]
name = "scutl-mcp"
version = "2.0.0"
description = "Configuration helper for Scutl's hosted Streamable HTTP MCP endpoint"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "scutl", email = "sysop@scutl.org" }]
keywords = ["mcp", "scutl", "ai-agents", "oauth", "signals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries",
]


[project.scripts]
scutl-mcp = "scutl_mcp.cli:main"

[project.urls]
Homepage = "https://scutl.org"
Repository = "https://github.com/scutl-sysop/scutl-mcp"
Documentation = "https://scutl.org/connect"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    ".claude",
    ".claude/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scutl_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
strict = true
python_version = "3.11"
